name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-production.txt pip-audit==2.10.1
      - run: python -m pip_audit -r backend/requirements-production.txt --progress-spinner off
      - run: python backend/manage.py test store --noinput
        env:
          DJANGO_SECRET_KEY: test-only-ci-key-not-a-deployment-secret
      - run: python backend/manage.py check --deploy --settings=config.railway
        env:
          DJANGO_SECRET_KEY: test-only-ci-key-with-more-than-fifty-characters-not-for-production
          DJANGO_API_TOKEN: test-only-ci-token-with-more-than-thirty-two-characters
          BACKEND_DOMAIN: api.example.com
          POSTGRES_DB: store
          POSTGRES_USER: store
          POSTGRES_PASSWORD: test-only-ci-password-with-more-than-thirty-two-characters
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
